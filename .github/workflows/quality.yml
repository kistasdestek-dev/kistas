name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Security, tests and Workers build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24.18.0
          cache: true
          require-lockfile: true

      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}-

      - name: Verify pinned toolchain
        run: |
          node --version
          pnpm --version

      - name: Run fail-closed quality gate
        run: pnpm sayos:audit

      - name: Build Cloudflare Workers package
        run: pnpm --filter @kistas/web build:vinext

      - name: Validate Cloudflare deployment bundle
        run: pnpm --filter @kistas/web exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}-${{ github.sha }}
